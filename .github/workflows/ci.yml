name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.12", "3.13"]
        include:
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v 2>&1 | tee test-report.txt
      - name: Upload test report
        # Only when something failed: a green run's report is noise that costs storage.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report-py${{ matrix.python }}-${{ matrix.os }}
          path: test-report.txt
          retention-days: 7

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m compileall -q scripts hooks tools tests
      - name: Ruff
        run: |
          python -m pip install --quiet ruff==0.6.9
          ruff check scripts hooks tools tests
      - name: ShellCheck the executables
        run: shellcheck bin/*

  plugin:
    name: plugin structure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prose, agents, templates and manifests agree
        run: python tools/validate_plugin.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Official manifest validation
        # Advisory: the required structural check is the step above. This one
        # installs a CLI we do not pin, so it must not be able to block a merge.
        continue-on-error: true
        run: |
          npm install --global --silent @anthropic-ai/claude-code
          claude plugin validate .

  package:
    needs: [tests, lint, plugin]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the plugin archive
        run: python tools/package.py
      - name: The archive is reproducible
        run: |
          cp dist/SHA256SUMS first.sums
          python tools/package.py
          diff first.sums dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: sdlc-plugin
          path: dist/
          if-no-files-found: error
          retention-days: 14
